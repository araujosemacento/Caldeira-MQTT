services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto-caldeira
    restart: unless-stopped
    ports:
      # Restringe a exposição da porta sem autenticação só à interface local
      - "127.0.0.1:1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
