name: Release e Compilação de Binários

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semver:
    name: Calcular Próxima Versão SemVer
    runs-on: ubuntu-latest
    outputs:
      nova_tag: ${{ steps.calc.outputs.nova_tag }}
      deve_publicar: ${{ steps.calc.outputs.deve_publicar }}
    steps:
      - name: Clonar repositório com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analisar histórico de commits e calcular SemVer
        id: calc
        run: |
          git fetch --tags --force || true

          # Obtém a última tag SemVer (formato vX.Y.Z)
          ULTIMA_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$ULTIMA_TAG" ]; then
            NOVA_TAG="v0.1.0"
            echo "Nenhuma tag anterior encontrada. Versão inicial: ${NOVA_TAG}"
            echo "nova_tag=${NOVA_TAG}" >> "$GITHUB_OUTPUT"
            echo "deve_publicar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Última tag encontrada: ${ULTIMA_TAG}"

          # Verifica se existem novos commits desde a última tag
          QTD_COMMITS=$(git rev-list "${ULTIMA_TAG}..HEAD" --count)
          if [ "$QTD_COMMITS" -eq 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Nenhum commit novo desde ${ULTIMA_TAG}."
            echo "deve_publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSAO="${ULTIMA_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSAO"
          INCREMENTO="patch"

          # Analisa mensagens de commit segundo Conventional Commits
          while IFS= read -r ASSUNTO; do
            if [[ "$ASSUNTO" =~ ^[a-zA-Z]+(\(.+\))?!: ]] || [[ "$ASSUNTO" =~ BREAKING\ CHANGE ]]; then
              INCREMENTO="major"
              break
            elif [[ "$ASSUNTO" =~ ^feat(\(.+\))?: ]]; then
              if [ "$INCREMENTO" != "major" ]; then
                INCREMENTO="minor"
              fi
            fi
          done < <(git log "${ULTIMA_TAG}..HEAD" --format="%s")

          case "$INCREMENTO" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NOVA_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Nova versão calculada (${INCREMENTO}): ${NOVA_TAG}"
          echo "nova_tag=${NOVA_TAG}" >> "$GITHUB_OUTPUT"
          echo "deve_publicar=true" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Binários Linux (amd64)
    needs: semver
    if: needs.semver.outputs.deve_publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar dependências do WebKit e GTK no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compilar binários para Linux (amd64)
        run: |
          mkdir -p dist/linux
          cd cmd/sensor && wails build && cd ../..
          cp cmd/sensor/build/bin/caldeira-sensor dist/linux/
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/linux/caldeira-cat ./cmd/cat
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/linux/caldeira-alarms ./cmd/alarms
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/linux/caldeira-inspector ./cmd/inspector

      - name: Empacotar binários Linux (.tar.gz)
        run: |
          mkdir -p pacotes
          TAG="${{ needs.semver.outputs.nova_tag }}"
          tar -czvf "pacotes/caldeira-mqtt-linux-amd64-${TAG}.tar.gz" -C dist/linux .

      - name: Enviar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-linux-amd64
          path: pacotes/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Binários Windows (amd64)
    needs: semver
    if: needs.semver.outputs.deve_publicar == 'true'
    runs-on: windows-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Instalar Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compilar binários para Windows (amd64)
        shell: bash
        run: |
          mkdir -p dist/windows
          cd cmd/sensor && wails build && cd ../..
          cp cmd/sensor/build/bin/caldeira-sensor.exe dist/windows/
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/windows/caldeira-cat.exe ./cmd/cat
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/windows/caldeira-alarms.exe ./cmd/alarms
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/windows/caldeira-inspector.exe ./cmd/inspector

      - name: Empacotar binários Windows (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacotes | Out-Null
          $Tag = "${{ needs.semver.outputs.nova_tag }}"
          Compress-Archive -Path "dist\windows\*" -DestinationPath "pacotes\caldeira-mqtt-windows-amd64-$Tag.zip" -Force

      - name: Enviar artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-windows-amd64
          path: pacotes/*.zip
          if-no-files-found: error

  release:
    name: Publicar Tag e Release no GitHub
    needs: [semver, build-linux, build-windows]
    if: needs.semver.outputs.deve_publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar pacotes compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Gerar checksums SHA256
        run: |
          cd release-assets
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Criar Tag e Publicar Release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA_TAG: ${{ needs.semver.outputs.nova_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NOVA_TAG" -m "Release $NOVA_TAG"
          git push origin "$NOVA_TAG"

          gh release create "$NOVA_TAG" ./release-assets/* \
            --title "Release $NOVA_TAG" \
            --generate-notes
